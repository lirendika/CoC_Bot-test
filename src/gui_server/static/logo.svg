<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="CoC Bot">
  <defs>
    <linearGradient id="steelL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dde6ee"/>
    </linearGradient>
    <linearGradient id="steelR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b3c2cf"/>
      <stop offset="1" stop-color="#8396a8"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0a0"/>
      <stop offset="0.45" stop-color="#ffc93c"/>
      <stop offset="1" stop-color="#d9800f"/>
    </linearGradient>
    <linearGradient id="leather" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a8682e"/>
      <stop offset="1" stop-color="#6b3a14"/>
    </linearGradient>
    <radialGradient id="gem" cx="0.38" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ff9a8a"/>
      <stop offset="0.5" stop-color="#e8342a"/>
      <stop offset="1" stop-color="#8c1010"/>
    </radialGradient>
    <radialGradient id="pommel" cx="0.38" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset="0.5" stop-color="#ffc63a"/>
      <stop offset="1" stop-color="#c8720c"/>
    </radialGradient>
  </defs>

  <g transform="rotate(45 256 256)" stroke="#1d1a17" stroke-linejoin="round" stroke-linecap="round">
    <!-- grip -->
    <rect x="236" y="384" width="40" height="104" rx="8" fill="url(#leather)" stroke-width="12"/>
    <path d="M238 404 L274 392 M238 430 L274 418 M238 456 L274 444 M238 482 L274 470" stroke="#4a260b" stroke-width="7" fill="none"/>

    <!-- blade: light left bevel, darker right bevel, one outline around both -->
    <path d="M256 -40 L292 22 L292 354 L256 354 Z" fill="url(#steelR)" stroke="none"/>
    <path d="M256 -40 L220 22 L220 354 L256 354 Z" fill="url(#steelL)" stroke="none"/>
    <path d="M256 -2 L256 330" stroke="#7f93a6" stroke-width="6" fill="none"/>
    <path d="M232 30 L232 336" stroke="#ffffff" stroke-width="6" stroke-opacity="0.9" fill="none"/>
    <path d="M256 -40 L292 22 L292 354 L220 354 L220 22 Z" fill="none" stroke-width="14"/>

    <!-- crossguard with a ruby -->
    <path d="M150 352 Q150 336 168 340 L344 340 Q362 336 362 352 L362 382 Q362 398 344 394 L168 394 Q150 398 150 382 Z" fill="url(#gold)" stroke-width="13"/>
    <path d="M170 352 L342 352" stroke="#fff6c8" stroke-width="6" stroke-opacity="0.9" fill="none"/>
    <circle cx="256" cy="367" r="17" fill="url(#gem)" stroke-width="8"/>

    <!-- pommel -->
    <circle cx="256" cy="512" r="30" fill="url(#pommel)" stroke-width="13"/>
    <circle cx="246" cy="502" r="8" fill="#fffbe0" stroke="none" fill-opacity="0.9"/>
  </g>
</svg>
