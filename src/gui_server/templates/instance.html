<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>CoC Bot</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='logo.svg') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="app">
        <header class="topbar">
            <img class="logo" src="{{ url_for('static', filename='logo.svg') }}" alt="">
            <div class="brand supercell outlined">CoC Bot</div>
            <a class="instance-tag supercell outlined" href="/" title="Bot instances">{{ id }}</a>
        </header>

        <section class="status" id="status" data-state="starting">
            <span class="status-dot"></span>
            <div>
                <div class="status-title supercell outlined" id="status_title">Starting</div>
                <div class="status-sub" id="status_sub">Connecting to BlueStacks…</div>
            </div>
        </section>

        <section class="actions">
            <button type="button" class="btn btn-big" id="attack_button"></button>
            <div class="pause-row">
                <button type="button" class="btn btn-mid" id="pause_button"></button>
                <div class="pause-for" title="Pause for a while: the bot starts over by itself afterwards">
                    <span class="pause-for-label">Pause<br>for</span>
                    <button type="button" class="chip" data-minutes="15">15m</button>
                    <button type="button" class="chip" data-minutes="30">30m</button>
                    <button type="button" class="chip" data-minutes="60">1h</button>
                </div>
            </div>
        </section>

        <section class="panel">
            <h2 class="panel-title supercell outlined">
                <img class="title-icon" src="{{ url_for('static', filename='logo.svg') }}" alt="">
                <span class="grow">Attack</span>
            </h2>
            <div class="rows" id="rows_attack"></div>
            <div class="setting loot-setting" title="Skips enemy bases with less loot ('Next' until one has enough). 0 = no minimum">
                <div class="row-text">
                    <span class="row-label">Minimum Loot</span>
                    <span class="row-desc">Skips poorer bases, 0 = no minimum</span>
                </div>
                <div class="setting-inputs" id="loot_inputs"></div>
            </div>
        </section>

        <section class="panel">
            <h2 class="panel-title supercell outlined">
                <svg class="title-icon" viewBox="0 0 32 32" aria-hidden="true">
                    <g transform="rotate(-40 16 16)" stroke="#1d1a17" stroke-width="2.5" stroke-linejoin="round">
                        <rect x="13.5" y="10" width="5" height="20" rx="2" fill="#b0743a"/>
                        <rect x="4.5" y="3" width="23" height="9" rx="2.5" fill="#dfe6ec"/>
                    </g>
                </svg>
                <span class="grow">Upgrades</span>
            </h2>
            <div class="rows" id="rows_upgrades"></div>
        </section>

        <section class="panel">
            <h2 class="panel-title supercell outlined">
                <svg class="title-icon" viewBox="0 0 32 32" aria-hidden="true">
                    <path d="M19.5 3.5 A13 13 0 1 0 28.5 21.5 A10 10 0 0 1 19.5 3.5 Z" fill="#ffe27a" stroke="#1d1a17" stroke-width="2.5" stroke-linejoin="round"/>
                </svg>
                <span class="grow">Rest</span>
            </h2>
            <div class="rows" id="rows_rest"></div>
        </section>

        <section class="panel locked" aria-disabled="true" title="Not adapted to the new Clash of Clans UI yet">
            <h2 class="panel-title supercell outlined">
                <span class="grow">Builder Base</span>
                <span class="badge supercell">Soon</span>
            </h2>
            <div class="rows" id="rows_builder"></div>
        </section>

        <div class="footer">
            <button type="button" class="btn btn-small btn-red" id="shutdown_button">Shut Down</button>
        </div>
    </div>

    <div class="modal" id="shutdown_modal" hidden>
        <section class="panel">
            <h2 class="panel-title supercell outlined"><span class="grow">Shut down?</span></h2>
            <div class="modal-body">
                The bot stops and BlueStacks closes too.
                <div class="modal-buttons">
                    <button type="button" class="btn btn-small btn-grey" id="shutdown_cancel">Cancel</button>
                    <button type="button" class="btn btn-small btn-red" id="shutdown_confirm">Shut Down</button>
                </div>
            </div>
        </section>
    </div>

    <script>
        const id = {{ id | tojson }};
        const webAppUrl = {{ web_app_url | tojson }};
        let clock = { server: {{ current_time }}, local: Date.now() };
        let endTime = {{ end_time }};
        let runStatus = {{ run_status | tojson }};
        let restUntil = {{ rest_until | tojson }};
        let exclusions = new Set({{ exclusions | tojson }});
        const unavailable = new Set({{ unavailable | tojson }});
        let settings = {{ settings | tojson }};

        const PAUSE_FOREVER = 525600;   // minutes: a year, until Resume is pressed

        // [exclusion key, label, short description, full tooltip]
        const OPTIONS = {
            attack: [
                ["smart_attack", "Smart Attack", "Richest side, deploys along the red line",
                 "ON: picks the best side(s) by loot and deploys along the red line. OFF: troops deploy at a random edge point"],
                ["ai_attack", "AI Attack", "A vision AI picks the side (needs a Groq key)",
                 "ON: a vision AI picks the attack side(s) by loot and weakest defenses, falling back to the loot heuristic if the API fails"],
                ["spam_event", "Spam Event", "One troop, two-finger spam for events",
                 "ON: brings one troop type and spams it with two held fingers along the side lines, deploys heroes with abilities and spreads rage spells. Overrides the normal and smart attack"],
                ["stop_attack_when_full", "Stop When Full", "No attacks once gold and elixir are full",
                 "ON: stops attacking once both storages are full. OFF: keeps attacking regardless of storage"],
            ],
            upgrades: [
                ["home_base", "Buildings", "Upgrades with every free builder",
                 "Home village building upgrades"],
                ["home_base_priority", "Building Priority", "Follows your list in configs.py (off: random)",
                 "ON: upgrades in the order of HOME_BASE_UPGRADE_PRIORITY. OFF: picks at random"],
                ["wall_focus", "Wall Focus", "Keeps a builder free for walls",
                 "Keeps 1 builder free to keep upgrading walls whenever loot allows"],
                ["heroes", "Heroes", "Includes hero upgrades",
                 "Hero upgrades"],
                ["home_lab", "Laboratory", "Starts research when the lab is free",
                 "Home village laboratory research"],
                ["home_lab_priority", "Research Priority", "Follows your list in configs.py (off: random)",
                 "ON: researches in the order of HOME_LAB_UPGRADE_PRIORITY. OFF: picks at random"],
                ["builder_apprentice", "Builder's Apprentice", "Puts him to work whenever he's free",
                 "Assigns the Builder's Apprentice to the upgrade with the most time left"],
                ["lab_assistant", "Lab Assistant", "Puts the assistant to work whenever free",
                 "Assigns the Lab Assistant to the research with the most time left"],
            ],
            rest: [
                ["rest_when_idle", "Rest When Idle", "Closes CoC while there's nothing to do",
                 "ON: after a round with no battle and no new upgrade (storages full, builders and lab busy), CoC closes for the rest time so the Mac cools down, then the bot checks again. Your village can be attacked while CoC is closed. OFF: CoC stays open and the bot checks again within seconds"],
            ],
            builder: [
                ["builder_base", "Upgrades", "Builder Base buildings", ""],
                ["builder_lab", "Star Laboratory", "Builder Base research", ""],
                ["builder_attacks", "Attacks", "Builder Base battles", ""],
            ],
        };

        const ICONS = {
            pause: '<svg viewBox="0 0 24 24" width="26" height="26"><rect x="4" y="3" width="6" height="18" rx="2" fill="#fff" stroke="#1d1a17" stroke-width="2.5"/><rect x="14" y="3" width="6" height="18" rx="2" fill="#fff" stroke="#1d1a17" stroke-width="2.5"/></svg>',
            play: '<svg viewBox="0 0 24 24" width="26" height="26"><path d="M6 3.5 L20.5 12 L6 20.5 Z" fill="#fff" stroke="#1d1a17" stroke-width="2.5" stroke-linejoin="round"/></svg>',
            stop: '<svg viewBox="0 0 24 24" width="30" height="30"><rect x="4" y="4" width="16" height="16" rx="3" fill="#fff" stroke="#1d1a17" stroke-width="2.5"/></svg>',
            lock: '<svg viewBox="0 0 24 24" width="18" height="18"><path d="M7.5 11 V7.5 a4.5 4.5 0 0 1 9 0 V11" fill="none" stroke="#1d1a17" stroke-width="3"/><rect x="4" y="10" width="16" height="11" rx="2.5" fill="#fff" stroke="#1d1a17" stroke-width="2.5"/></svg>',
            gold: '<svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="7.5" fill="#ffd23a" stroke="#1d1a17" stroke-width="2"/><circle cx="7.8" cy="7.8" r="2.2" fill="#fff6c0"/></svg>',
            elixir: '<svg viewBox="0 0 20 20"><path d="M10 2 C10 2 3.5 9 3.5 12.6 a6.5 6.5 0 0 0 13 0 C16.5 9 10 2 10 2 Z" fill="#e45ce8" stroke="#1d1a17" stroke-width="2" stroke-linejoin="round"/><circle cx="7.8" cy="12.4" r="1.8" fill="#ffd2ff"/></svg>',
            dark: '<svg viewBox="0 0 20 20"><path d="M10 2 C10 2 3.5 9 3.5 12.6 a6.5 6.5 0 0 0 13 0 C16.5 9 10 2 10 2 Z" fill="#3d2b4f" stroke="#1d1a17" stroke-width="2" stroke-linejoin="round"/><circle cx="7.8" cy="12.4" r="1.8" fill="#a48bc0"/></svg>',
        };
        const SWORD = `<img src="{{ url_for('static', filename='logo.svg') }}" alt="">`;

        const $ = (sel) => document.querySelector(sel);
        const url = (path) => webAppUrl ? `${webAppUrl}/${id}/${path}` : `/${id}/${path}`;
        const now = () => clock.server + (Date.now() - clock.local) / 1000;
        const isOn = (key) => !exclusions.has(key);
        const pausedFor = () => Math.max(0, endTime - now());
        const groupDigits = (n) => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, " ");

        function duration(seconds) {
            seconds = Math.max(0, Math.floor(seconds));
            const d = Math.floor(seconds / 86400), h = Math.floor(seconds % 86400 / 3600);
            const m = Math.floor(seconds % 3600 / 60), s = seconds % 60;
            if (d) return `${d}d ${h}h`;
            if (h) return `${h}h ${m}m`;
            if (m) return `${m}m ${s}s`;
            return `${s}s`;
        }

        async function getJSON(target, options) {
            const response = await fetch(target, options);
            if (!response.ok) throw new Error(`${response.status} ${target}`);
            return response.json();
        }

        const post = (target, body) => getJSON(target, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
        });

        async function syncClock() {
            try {
                const data = await getJSON(webAppUrl ? url("current_time") : "/current_time");
                clock = { server: data.current_time, local: Date.now() };
            } catch (error) { console.error("current_time", error); }
        }

        // Nobody looking (window minimized, covered or on another desktop):
        // one check every 30 s instead of every 2 s, and no repaints
        let lastRefresh = 0;
        async function refresh() {
            if (document.hidden && Date.now() - lastRefresh < 30000) return;
            lastRefresh = Date.now();
            try { endTime = (await getJSON(url("end_time"))).end_time; } catch (error) { console.error(error); }
            try {
                const data = await getJSON(url("status"));
                runStatus = data.status;
                restUntil = data.until || 0;
            } catch (error) { console.error(error); }
            try { exclusions = new Set((await getJSON(url("exclude"))).exclusions); } catch (error) { console.error(error); }
            render();
        }

        // minutes = 0 resumes; the bot then starts its cycle over from the beginning
        async function setPause(minutes) {
            endTime = minutes > 0 ? now() + minutes * 60 : 0;
            render();
            try { endTime = (await post(url("end_time"), { time: minutes })).end_time; } catch (error) { console.error(error); }
            await syncClock();
            render();
            setTimeout(refresh, 700);   // the bot's answer, sooner than the next poll
        }

        // An excluded task is OFF
        async function setOn(key, on) {
            if (unavailable.has(key)) return;
            on ? exclusions.delete(key) : exclusions.add(key);
            render();
            try {
                exclusions = new Set((await post(url("exclude"), { action: on ? "remove" : "add", item: key })).exclusions);
            } catch (error) { console.error(error); }
            render();
        }

        function statusView() {
            const left = pausedFor();
            if (left > 0) {
                const stopped = runStatus === "paused";
                const timed = left < 86400 * 30;
                return {
                    state: stopped ? "paused" : "pausing",
                    title: "Paused",
                    sub: !stopped ? "Stopping the bot…"
                        : timed ? `Hands off the game · starts over in ${duration(left)}`
                        : "Hands off the game · Resume starts it over",
                };
            }
            if (runStatus === "error") return { state: "error", title: "Error", sub: "Retrying · details in debug/main.log" };
            if (runStatus === "idle") return { state: "idle", title: "Standby", sub: "Everything is off · Start Attack or switch on an upgrade" };
            if (runStatus === "resting") {
                const left = restUntil - now();
                return {
                    state: "resting",
                    title: "Resting",
                    sub: left > 0 ? `Nothing to do · CoC closed, next check in ${duration(left)}` : "Checking the village again…",
                };
            }
            if (runStatus === "now") return { state: "running", title: "Running", sub: "Working on the village…" };
            if (typeof runStatus === "number") return { state: "running", title: "Running", sub: `Last round ${duration(now() - runStatus)} ago` };
            if (runStatus === "paused") return { state: "starting", title: "Starting", sub: "Starting over from the beginning…" };
            return { state: "starting", title: "Starting", sub: "Connecting to BlueStacks…" };
        }

        // DOM writes only when something changed: an unchanged page never repaints
        const setText = (el, text) => { if (el.textContent !== text) el.textContent = text; };
        const setAttr = (el, name, value) => { if (el.getAttribute(name) !== value) el.setAttribute(name, value); };

        function setButton(button, color, icon, label, title) {
            const html = `${icon}<span>${label}</span>`;
            if (button.dataset.html !== html) { button.innerHTML = html; button.dataset.html = html; }
            if (!button.classList.contains(color)) {
                button.classList.remove("btn-yellow", "btn-red", "btn-green", "btn-blue");
                button.classList.add(color);
            }
            setAttr(button, "title", title);
        }

        function render() {
            const view = statusView();
            const status = $("#status");
            setAttr(status, "data-state", view.state);
            // Starting / stopping blink once a second, driven from here: an
            // endless CSS animation would redraw the window 60 times a second
            const blinking = view.state === "starting" || view.state === "pausing";
            setAttr(status, "data-blink", blinking && Math.floor(Date.now() / 1000) % 2 ? "dim" : "");
            setText($("#status_title"), view.title);
            setText($("#status_sub"), view.sub);

            const paused = pausedFor() > 0;
            if (isOn("home_attacks")) {
                setButton($("#attack_button"), "btn-red", ICONS.stop, "Stop Attack",
                    "No new battles after the current one (Pause stops everything at once)");
            } else {
                setButton($("#attack_button"), "btn-yellow", SWORD, "Start Attack",
                    paused ? "Resume the bot and start attacking" : "Start attacking");
            }
            if (paused) {
                setButton($("#pause_button"), "btn-green", ICONS.play, "Resume", "The bot starts over from the beginning");
            } else {
                setButton($("#pause_button"), "btn-blue", ICONS.pause, "Pause",
                    "Stops every bot touch right away, so you can play yourself");
            }

            document.querySelectorAll(".row[data-key]").forEach((row) => {
                if (row.disabled) return;
                const on = isOn(row.dataset.key);
                setAttr(row, "aria-pressed", on ? "true" : "false");
                setText(row.querySelector(".switch"), on ? "ON" : "OFF");
            });
        }

        function buildRows(container, options, locked) {
            for (const [key, label, desc, tip] of options) {
                const row = document.createElement("button");
                row.type = "button";
                row.className = "row";
                row.dataset.key = key;
                row.title = locked ? "Not adapted to the new Clash of Clans UI yet" : tip;
                row.innerHTML = `
                    <span class="row-text">
                        <span class="row-label">${label}</span>
                        <span class="row-desc">${desc}</span>
                    </span>
                    <span class="switch">${locked ? ICONS.lock : "OFF"}</span>`;
                if (locked) row.disabled = true;
                else row.addEventListener("click", () => setOn(key, !isOn(key)));
                container.appendChild(row);
            }
        }

        function buildField(container, key, icon, max, unit = "percent") {
            const field = document.createElement("label");
            field.className = icon ? "field" : `field ${unit}`;
            field.innerHTML = `${icon || ""}<input type="text" inputmode="numeric" autocomplete="off">`;
            const input = field.querySelector("input");
            const show = () => { input.value = groupDigits(settings[key] ?? 0); };
            input.addEventListener("focus", () => { input.value = String(settings[key] ?? 0); input.select(); });
            input.addEventListener("input", () => { input.value = input.value.replace(/\D/g, ""); });
            input.addEventListener("keydown", (e) => { if (e.key === "Enter") input.blur(); });
            input.addEventListener("blur", async () => {
                let value = parseInt(input.value || "0", 10);
                if (max !== undefined) value = Math.min(value, max);
                if (value !== settings[key]) {
                    try {
                        settings = (await post(url("settings"), { [key]: value })).settings;
                        input.classList.add("saved");
                        setTimeout(() => input.classList.remove("saved"), 800);
                    } catch (error) { console.error(error); }
                }
                show();
            });
            show();
            container.appendChild(field);
        }

        buildRows($("#rows_attack"), OPTIONS.attack, false);
        buildRows($("#rows_upgrades"), OPTIONS.upgrades, false);
        buildRows($("#rows_rest"), OPTIONS.rest, false);
        buildRows($("#rows_builder"), OPTIONS.builder, true);

        buildField($("#loot_inputs"), "min_loot_gold", ICONS.gold);
        buildField($("#loot_inputs"), "min_loot_elixir", ICONS.elixir);
        buildField($("#loot_inputs"), "min_loot_dark", ICONS.dark);

        // Wall focus threshold sits right under its switch
        const wallRow = document.querySelector('.row[data-key="wall_focus"]');
        const wallSetting = document.createElement("div");
        wallSetting.className = "setting";
        wallSetting.title = "Only upgrade walls when a storage bar is at least this full";
        wallSetting.innerHTML = `
            <div class="row-text">
                <span class="row-label">Wall Focus Storage</span>
                <span class="row-desc">Walls once a storage is this full</span>
            </div>
            <div class="setting-inputs"></div>`;
        wallRow.after(wallSetting);
        buildField(wallSetting.querySelector(".setting-inputs"), "wall_focus_min_storage_pct", null, 100);

        // Rest time sits right under its switch (the server keeps it 1-240)
        const restSetting = document.createElement("div");
        restSetting.className = "setting";
        restSetting.title = "How long CoC stays closed before the bot checks the village again";
        restSetting.innerHTML = `
            <div class="row-text">
                <span class="row-label">Rest Time</span>
                <span class="row-desc">CoC stays closed this long</span>
            </div>
            <div class="setting-inputs"></div>`;
        document.querySelector('.row[data-key="rest_when_idle"]').after(restSetting);
        buildField(restSetting.querySelector(".setting-inputs"), "rest_minutes", null, 240, "minutes");

        $("#attack_button").addEventListener("click", async () => {
            if (isOn("home_attacks")) return setOn("home_attacks", false);
            await setOn("home_attacks", true);
            if (pausedFor() > 0) await setPause(0);
        });
        $("#pause_button").addEventListener("click", () => setPause(pausedFor() > 0 ? 0 : PAUSE_FOREVER));
        document.querySelectorAll(".chip").forEach((chip) => {
            chip.addEventListener("click", () => setPause(parseInt(chip.dataset.minutes, 10)));
        });

        $("#shutdown_button").addEventListener("click", () => { $("#shutdown_modal").hidden = false; });
        $("#shutdown_cancel").addEventListener("click", () => { $("#shutdown_modal").hidden = true; });
        $("#shutdown_confirm").addEventListener("click", async () => {
            try { await post("/instance", { action: "stop", id: id }); } catch (error) { console.error(error); }
            window.location.href = "/";
        });

        window.addEventListener("keydown", (event) => {
            if (event.key !== "Escape") return;
            event.preventDefault();
            if (!$("#shutdown_modal").hidden) $("#shutdown_modal").hidden = true;
            else window.location.href = "/";
        }, true);

        render();
        refresh();
        setInterval(refresh, 2000);
        setInterval(() => { if (!document.hidden) render(); }, 1000);
        setInterval(syncClock, 30000);
        document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
    </script>
</body>
</html>
