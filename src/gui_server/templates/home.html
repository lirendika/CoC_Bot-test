<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>CoC Bot</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='logo.svg') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="app">
        <header class="topbar">
            <img class="logo" src="{{ url_for('static', filename='logo.svg') }}" alt="">
            <div class="brand supercell outlined">CoC Bot</div>
        </header>

        <section class="panel">
            <h2 class="panel-title supercell outlined"><span class="grow">Villages</span></h2>
            <form class="start-form" id="start_form">
                <input type="text" name="id" placeholder="Instance ID" required title="Instance ID from configs.py" autofocus>
                <button type="submit" class="btn btn-small btn-green">Open</button>
            </form>
            <div class="instance-list" id="instance_list"></div>
        </section>
    </div>

    <script>
        const ids = {{ ids | default([]) | tojson }};

        async function registerID(newID) {
            try {
                const response = await fetch("/instance", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ action: "start", id: newID }),
                });
                if (await response.json() === 0) {
                    alert("Invalid ID");
                    return false;
                }
                return true;
            } catch (error) {
                console.error("Error setting ID:", error);
                return false;
            }
        }

        for (const id of ids) {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "btn btn-small btn-yellow";
            button.textContent = id;
            button.addEventListener("click", () => { window.location.href = `/${id}`; });
            document.getElementById("instance_list").appendChild(button);
        }

        document.getElementById("start_form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const newID = new FormData(e.target).get("id").trim();
            if (newID && await registerID(newID)) window.location.href = `/${newID}`;
        });
    </script>
</body>
</html>
